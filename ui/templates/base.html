<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Edenguide{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Edenguide — на главную">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Edenguide</span>
      </a>
      <nav class="nav" aria-label="Основная навигация">
        <a class="nav-link" href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Главная</a>
        <a class="nav-link" href="/tierlist" {% if request.url.path == '/tierlist' %}aria-current="page"{% endif %}>Тирлист</a>
        <a class="nav-link" href="/library" {% if request.url.path == '/library' %}aria-current="page"{% endif %}>Библиотека</a>
        <a class="nav-link" href="/coaching" {% if request.url.path == '/coaching' %}aria-current="page"{% endif %}>Коучинг</a>
        <a class="nav-link" href="/about" {% if request.url.path == '/about' %}aria-current="page"{% endif %}>Об авторе</a>
        {% if is_admin %}
          <a class="nav-link" href="/admin-panel" {% if request.url.path == '/admin-panel' %}aria-current="page"{% endif %}>Админка</a>
        {% endif %}
        {% if request.session.get('user_id') %}
          <a class="nav-link" href="/profile" {% if request.url.path == '/profile' %}aria-current="page"{% endif %}>Профиль</a>
          <form method="post" action="/logout" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token | default('') }}">
            <button type="submit" class="link-btn">Выйти</button>
          </form>
        {% else %}
          <a class="nav-link" href="/login" {% if request.url.path == '/login' %}aria-current="page"{% endif %}>Войти</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main id="main-content" class="container main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Edenguide <span class="footer-accent">//</span> VALORANT</span>
      <span>Такт. база знаний</span>
    </div>
  </footer>
</body>
</html>
